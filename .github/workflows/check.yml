name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - name: Restore TLA+ tools
        id: tla2tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: spec/tools/tla2tools.jar
          key: tla2tools-${{ env.TLA2TOOLS_SHA256 }}

      - name: Download TLA+ tools
        if: steps.tla2tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p spec/tools
          curl --fail --silent --show-error --location --output spec/tools/tla2tools.jar "$TLA2TOOLS_URL"

      - name: Verify TLA+ tools
        run: echo "$TLA2TOOLS_SHA256  spec/tools/tla2tools.jar" | sha256sum --check

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run type-check
      - run: bun run test
      - run: bun run tlc
